<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ifood</title>
    <link rel="shortcut icon" href="./src/img/ifood-43.svg" type="Ícone do Ifood">
    <link rel="stylesheet" href="./src/css/general.css">
</head>
<body>
    <header class="cabecalho">
    <img class="logo" src="./src/img/ifood-43.svg" alt="ícone do Ifood">
    <ul class="menu">
        <li><a href="">Home</a></li>
        <li><a href="">Carrinho</a></li>
        <li><a href="">Pedidos </a></li>
    </ul>
    </header>
    <main class="home" id="home">
        <h1>Mini Ifood</h1>

        <h2>Escolha seu lanche:</h2>
        <div class="produtos">
        <div class="card">
            <img src="./src/img/04210725ae30e4435fff7d04c122507e.jpg" alt="Imagem de um Hambúrguer" height="80px" width="80px">
            <h3>Hambúrguer</h3>
            <p>R$ 20,00</p>
            <button>Adicionar ao carrinho</button>
        </div>
        <div class="card">
            <img src="./src/img/2454ccc01f577e43834e377fd457977f.jpg" alt="Imagem de uma pizza" height="80px" width="80px">
            <h3>Pizza</h3>
            <p>R$ 30,00</p>
            <button>Adicionar ao carrinho</button>
        </div>
        <div class="card">
            <img src="./src/img/8cb020babaeb7586ac0f70c89dae9b06.jpg" alt="Imagem de refrigerante" height="80px" width="80px">
            <h3>refrigerante</h3>
            <p>R$ 10,00</p>
            <button>Adicionar ao carrinho</button>
        </div>
    </div>
    </main>
    <script src="./src/js/index.js"></script>
</body>
</html>
